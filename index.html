    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function(){
        function startTicker() {
          const track = document.getElementById('bottomTickerTrack');
          if (track && !track.getAttribute('data-running')) {
            track.setAttribute('data-running', 'true');
            track.innerHTML = track.innerHTML + track.innerHTML + track.innerHTML;
            let x = 0;
            function tick(){
              x -= 1.2; // speed - same as top ticker
              if (Math.abs(x) >= track.scrollWidth / 3) x = 0;
              track.style.transform = 'translateX(' + x + 'px)';
              requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', startTicker);
        } else {
          startTicker();
        }
        const observer = new MutationObserver(function() {
          if (document.getElementById('bottomTickerTrack')) {
            startTicker();
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
