<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#805A00"/>
    </linearGradient>
    <radialGradient id="globeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Subtle background glow -->
  <circle cx="256" cy="256" r="210" fill="url(#globeGlow)"/>
  
  <!-- Outer Gold Hexagon/Circle border -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="14 10" opacity="0.85"/>
  <circle cx="256" cy="256" r="172" fill="#08080a" stroke="#222" stroke-width="2"/>
  
  <!-- Green Globe latitude and longitude grid -->
  <circle cx="256" cy="256" r="148" fill="#040906" stroke="url(#emeraldGrad)" stroke-width="4"/>
  <ellipse cx="256" cy="256" rx="90" ry="148" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.6"/>
  <ellipse cx="256" cy="256" rx="40" ry="148" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.6"/>
  <line x1="108" y1="256" x2="404" y2="256" stroke="#10b981" stroke-width="2.5" opacity="0.6"/>
  <ellipse cx="256" cy="180" rx="124" ry="40" fill="none" stroke="#10b981" stroke-width="2" opacity="0.45"/>
  <ellipse cx="256" cy="332" rx="124" ry="40" fill="none" stroke="#10b981" stroke-width="2" opacity="0.45"/>

  <!-- Center Emblem: AQARI Monogram with Golden Bevel -->
  <rect x="176" y="196" width="160" height="120" rx="24" fill="#000000" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <text x="256" y="274" font-family="'JetBrains Mono', 'Geist', monospace, sans-serif" font-weight="900" font-size="64" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-2">AQ</text>
  
  <!-- Arabic Subtle Subtext عقاري -->
  <text x="256" y="380" font-family="'Geist', 'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="28" fill="#D4AF37" text-anchor="middle" letter-spacing="4">عـقـــاري</text>
  
  <!-- Small live indicator -->
  <circle cx="388" cy="124" r="10" fill="#10b981"/>
  <circle cx="388" cy="124" r="18" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
</svg>
